<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Protection Films</title>
    <link rel="stylesheet" href="loginstyle.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link href="https://googleapis.com" rel="stylesheet" />
  </head>
  <body>
    <div id="board">
      <img src="logo.png" id="logo" />

      <p id="falogin">Entre na sua conta Protection Films</p>

      <div id="nomediv"><label>Nome</label>
      <br />
      <input type="text" id="inputname" placeholder="Nome"/> </div>
      <div id="emaildiv"><label>E-mail</label>
      <br />
      <input type="email" id="inputemail" placeholder="E-mail"/> </div>
      <div id="senhadiv"><label>Senha</label>
      <br />
      <input type="password" id="inputsenha" placeholder="Senha"/> </div>
      
      <button id="entrar">Entrar</button>

      <p id="ou">Ou entre com:</p>

      <button class="entrarcom">
        <img src="google.png" id="google" /> <div class="btntexto">Google</div>
      </button>

      <button class="entrarcom">
        <img src="microsoft.svg" id="microsoft" /> <div class="btntexto">Microsoft</div>
      </button>
      </button>

      <button class="entrarcom">
        <img src="facebook.svg" id="facebook" /> <div class="btntexto">Facebook</div>
      </button>

      <p id="jatem">Não tem uma conta? <a href="index.html">Cadastre-se</a></p>

      <p id="mensagem"></p>
    </div>

    

      <script src="script.js" defer></script>
  </body>
</html>
